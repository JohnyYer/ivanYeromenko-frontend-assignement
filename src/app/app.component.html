<mat-toolbar color="primary">
  <!-- Mobile menu button -->
  <button mat-icon-button (click)="toggleSidenav()" class="mobile-menu-button">
    <mat-icon>menu</mat-icon>
  </button>

  <span class="logo-text">Client Management System</span>
  <span class="spacer"></span>

  <!-- Desktop navigation -->
  <nav class="desktop-nav">
    <button mat-button routerLink="/" routerLinkActive="active">
      <mat-icon>home</mat-icon>
      Home
    </button>
    <button mat-button routerLink="/clients" routerLinkActive="active">
      <mat-icon>people</mat-icon>
      Clients
    </button>
  </nav>
</mat-toolbar>

<!-- Mobile Sidenav -->
<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #sidenav mode="over" position="start" class="mobile-sidenav">
    <div class="sidenav-header">
      <h2>Menu</h2>
      <button mat-icon-button (click)="sidenav.close()" class="close-button">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <mat-nav-list class="sidenav-list">
      <a
        mat-list-item
        routerLink="/"
        routerLinkActive="active"
        (click)="sidenav.close()"
      >
        <mat-icon matListItemIcon>home</mat-icon>
        <span matListItemTitle>Home</span>
      </a>
      <a
        mat-list-item
        routerLink="/clients"
        routerLinkActive="active"
        (click)="sidenav.close()"
      >
        <mat-icon matListItemIcon>people</mat-icon>
        <span matListItemTitle>Clients</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
