<div class="create-client">
  <button style="font-size: 16px" (click)="showCreateForm()">
    Create client
  </button>
</div>
<div class="clients">
  <app-client-form
    [showForm]="showForm"
    [isEditMode]="isEditMode"
    [client]="editingClient"
    (formSubmit)="onFormSubmit($event)"
    (formCancel)="onFormCancel()"
  >
  </app-client-form>
  <div class="clients-filter">
    <h3>Filter clients</h3>
    <div class="flex-wrapper">
      <input
        type="text"
        placeholder="Filter by clients name"
        [(ngModel)]="searchTerm"
        (input)="onSearchChange()"
      />
      <div class="filter-checkbox-wrapper">
        <input
          id="filterCheckbox"
          type="checkbox"
          [(ngModel)]="filterActiveOnly"
          (change)="onFilterChange()"
        />
        <span style="padding-left: 8px"
          ><label for="filterCheckbox">Filter by active state</label></span
        >
      </div>
    </div>
  </div>
  <app-client-card
    *ngFor="let client of filteredClients; trackBy: trackByClientId"
    [client]="client"
    (edit)="editClient($event)"
    (delete)="deleteClient($event)"
  >
  </app-client-card>
</div>
