<div class="client-form" *ngIf="showForm">
  <h3>{{ formTitle }}</h3>
  <div class="form-group">
    <input
      type="text"
      placeholder="First name"
      [(ngModel)]="formData.firstName"
      name="firstName"
      required
    />
  </div>
  <div class="form-group">
    <input
      type="text"
      placeholder="Last name"
      [(ngModel)]="formData.lastName"
      name="lastName"
      required
    />
  </div>
  <div class="form-group">
    <input
      type="text"
      placeholder="Birthdate"
      [(ngModel)]="formData.birthdate"
      name="birthdate"
      required
    />
  </div>
  <div class="form-group">
    <label>
      <input
        type="checkbox"
        [(ngModel)]="formData.isActive"
        name="isActive"
      />
      Active Client
    </label>
  </div>
  <div class="form-actions">
    <button (click)="onSubmit()" [disabled]="!isValidForm()">
      {{ submitButtonText }}
    </button>
    <button (click)="onCancel()" type="button">
      Cancel
    </button>
  </div>
</div>
